<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F7FB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi Negocio · Puntos</title>
<meta name="description" content="Tu tarjeta de puntos: mirá tus puntos, tus premios y canjealos desde el celular.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Puntos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#0E141C; --card:#17202B; --field:#1F2A37; --ink:#EDF2F8; --ink2:#A2AFC2; --line:#2B3847; --on:#06262A;
  --violet:#35C2CC; --violet-d:#5FD3DB; --violet-s:rgba(53,194,204,.16);
  --ok:#47D697; --ok-s:rgba(71,214,151,.15); --warn:#FFC24D; --warn-s:rgba(255,194,77,.15); --bad:#FF7A72; --bad-s:rgba(255,122,114,.15);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --f-display:'Nunito','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Nunito','Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif;
  --nav-h:68px; --top-bg:rgba(14,20,28,.85);
}
:root[data-theme="light"]{
  --paper:#F4F7FB; --card:#fff; --field:#fff; --ink:#17212F; --ink2:#52607A; --line:#DCE4EF; --on:#fff;
  --violet:#0B7C86; --violet-d:#085F67; --violet-s:#DDF3F4;
  --ok:#1E9E6A; --ok-s:#DDF4E9; --warn:#7A5200; --warn-s:#FFF1D1; --bad:#D23B32; --bad-s:#FBE1DF;
  --shadow:0 1px 2px rgba(23,33,47,.06),0 8px 24px rgba(23,33,47,.07);
  --top-bg:rgba(244,247,251,.92);
}
html,body{height:100%}
html{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--violet-d)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:650;letter-spacing:-.01em;line-height:1.15}
.num{font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;flex-shrink:0}
.muted{color:var(--ink2)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.hide{display:none!important}

/* shell */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--top-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand small{display:block;font:500 12px var(--f-body);color:var(--ink2);letter-spacing:0}
.brand-logo{width:32px;height:32px;border-radius:9px;object-fit:cover;flex-shrink:0}
.logo-lg{width:88px;height:88px;border-radius:18px;object-fit:cover;flex-shrink:0;background:var(--field);border:1px solid var(--line)}
.view{padding:16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}
.view h1{font-size:26px;margin:4px 0 14px}
.view h2{font-size:17px;margin:22px 0 10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav-h);font-size:11.5px;font-weight:600;color:var(--ink2)}
.nav button[aria-current=page]{color:var(--violet)}
.nav button[aria-current=page] .ic{stroke-width:2.3}
@media(min-width:900px){
  .nav{top:0;right:auto;width:92px;flex-direction:column;justify-content:flex-start;padding-top:70px;border-top:0;border-right:1px solid var(--line)}
  .nav button{flex:none}
  .view,.top .brand{margin-left:auto;margin-right:auto}
  .top{padding-left:108px}
  .view{padding-left:108px;padding-right:24px;max-width:900px;margin:0 auto 0 0;padding-bottom:40px}
  .view.centered{margin:0 auto}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:650;background:var(--violet);color:#fff;border:1.5px solid var(--violet);text-decoration:none}
.btn:hover{background:var(--violet-d)}
.btn.ghost{background:transparent;color:var(--violet-d);border-color:var(--line)}
.btn.ghost:hover{background:var(--violet-s)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--ink2)}
.iconbtn:hover{background:var(--violet-s);color:var(--violet-d)}
.theme-fab{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:var(--card);border:1.5px solid var(--line)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2)}
label.f>span{display:block;margin-bottom:5px}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=password],input[type=search],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px var(--violet-s)}
input[type=color]{width:46px;height:46px;padding:3px;border:1.5px solid var(--line);border-radius:12px;background:var(--field)}
.hint{font-size:12.5px;color:var(--ink2);margin-top:5px;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--field);font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--violet);border-color:var(--violet);color:#fff}
.chip.qty{min-height:40px}
details.more{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
details.more>summary{cursor:pointer;font-weight:650;font-size:13.5px;color:var(--violet-d);list-style:none;display:flex;align-items:center;gap:6px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'+';font-size:16px;line-height:1;transition:transform .15s}
details.more[open]>summary::before{content:'−'}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--violet-s);color:var(--violet-d)}
.tag.ok{background:var(--ok-s);color:var(--ok)}.tag.warn{background:var(--warn-s);color:var(--warn)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0}

/* cards / lists */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{display:block;font:650 26px var(--f-display);font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--ink2)}
button.tile{width:100%;text-align:left;transition:border-color .15s,background .15s}
button.tile:hover{border-color:var(--violet);background:var(--violet-s)}
.tile.hero{grid-column:1/-1;background:var(--violet);border-color:var(--violet)}
.tile.hero b{font-size:34px;color:#fff}
.tile.hero span{color:rgba(255,255,255,.8)}
@media(min-width:620px){.tile.hero{grid-column:auto}}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
button.item:hover{background:#faf8fc}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:650 15px var(--f-display);color:#fff;flex-shrink:0}
.pts{font:650 17px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.empty{padding:28px 18px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11.5px;color:var(--ink2)}
.bars i{display:block;width:100%;background:var(--violet);border-radius:6px 6px 2px 2px;min-height:3px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--warn-s);color:#5f4108;font-size:14px;margin-bottom:14px}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:0 8px 24px rgba(67,42,158,.35)}
@media(min-width:900px){.fab{bottom:24px}}

/* tarjeta de muestrario */
.pcard{position:relative;background:var(--ink);color:#F5F2F7;border-radius:26px;padding:20px 20px 0;overflow:hidden}
.pcard .who{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pcard .salon{font-size:12.5px;opacity:.7}
.pcard h2{font-size:24px;margin:2px 0 0;color:#fff}
.pcard .code{font:600 12.5px var(--f-body);letter-spacing:.08em;opacity:.7;margin-top:4px}
.pcard .qr{background:#fff;border-radius:12px;padding:7px;width:92px;height:92px;display:grid;place-items:center;flex-shrink:0}
.pcard .qr canvas,.pcard .qr img{width:78px!important;height:78px!important}
.pcard .qr span{color:var(--ink);font:700 11px var(--f-body);text-align:center}
.pcard .big{margin:18px 0 4px;display:flex;align-items:baseline;gap:8px}
.pcard .big b{font:700 64px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.pcard .big span{font-size:16px;opacity:.75}
.pcard .next{font-size:13.5px;opacity:.85;margin-bottom:16px;max-width:34ch}
.swatches{display:flex;gap:8px;align-items:flex-end;height:104px;margin:0 -4px}
.sw{--c:#5B3A29;flex:1;position:relative;border-radius:10px 10px 0 0;height:74px;padding:8px 8px;display:flex;flex-direction:column;justify-content:space-between;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,transparent 1px 4px),linear-gradient(180deg,color-mix(in srgb,var(--c),white 20%),var(--c) 55%,color-mix(in srgb,var(--c),black 25%));
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);opacity:.78;transition:height .35s cubic-bezier(.3,1.3,.5,1)}
.sw.light{color:#2a2116;text-shadow:none}
.sw small{font-size:11px;font-weight:600;line-height:1.1}
.sw b{font:700 12px var(--f-display)}
.sw.done{opacity:.92}
.sw.on{height:104px;opacity:1;box-shadow:0 -2px 0 rgba(255,255,255,.9) inset}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--violet-d)}
.stamp.on{border:2px solid var(--violet);background:var(--violet-s)}
.stamp.gift{border-style:solid;color:var(--ink2)}
.stamp .ic{width:20px;height:20px}
.bar{height:8px;border-radius:99px;background:var(--violet-s);overflow:hidden}
.bar i{display:block;height:100%;background:var(--violet);border-radius:99px}
.reward{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.reward:last-child{border-bottom:0}
.reward .cost{font:700 15px var(--f-display);white-space:nowrap}

/* gate */
.gate{position:relative;min-height:100%;display:flex;flex-direction:column;justify-content:center;max-width:460px;margin:0 auto;padding:28px 20px}
.gate h1{font-size:38px;line-height:1.05;margin-bottom:10px}
.gate .lead{color:var(--ink2);margin-bottom:26px}
.gate .strips{display:flex;gap:6px;height:56px;margin-bottom:26px}
.gate .strips i{flex:1;border-radius:8px;--c:#000;background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,transparent 1px 4px),linear-gradient(180deg,color-mix(in srgb,var(--c),white 20%),var(--c) 60%,color-mix(in srgb,var(--c),black 25%))}
.gate .strips i:nth-child(1){height:70%;align-self:flex-end}.gate .strips i:nth-child(2){height:82%;align-self:flex-end}.gate .strips i:nth-child(3){height:94%;align-self:flex-end}.gate .strips i:nth-child(4){height:100%}

/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(34,25,43,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:86vh}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet>header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet>header h2{font-size:20px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px);transform:translateX(-50%);z-index:80;background:#24262c;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.video{width:100%;border-radius:14px;background:#000;aspect-ratio:1;object-fit:cover}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* premios con imagen */
.pgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.pgrid{grid-template-columns:1fr 1fr}}
.prize{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.prize-img{position:relative;aspect-ratio:16/10;background:var(--violet-s);display:grid;place-items:center;color:var(--violet);overflow:hidden}
.prize-img.big{border-radius:14px}
.prize-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prize-img .ph .ic{width:34px;height:34px;opacity:.55}
.prize-body{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1}
.prize-body h3{font-size:17px}
.prize-body p{margin-top:3px}
.cost{font:650 16px var(--f-display)}
.thumb{position:relative;width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--violet-s);display:grid;place-items:center;color:var(--violet);flex-shrink:0}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .ic{opacity:.55}
.imgbox{position:relative;aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:var(--violet-s);display:grid;place-items:center;border:1.5px dashed var(--line)}
.imgbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.imgbox .ph{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--violet);font-weight:600}
.imgbox .ph .ic{width:32px;height:32px;opacity:.6}
.canje-card{background:var(--violet);color:#fff;border-radius:20px;padding:16px 18px}
.canje-card p{opacity:.9;margin-top:2px}
.code-big{font:700 22px var(--f-display);letter-spacing:.08em;font-variant-numeric:tabular-nums;white-space:nowrap}
.nav button{position:relative}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font:700 11px/18px var(--f-body);text-align:center;font-style:normal}
.badge[hidden]{display:none}
.prize-img.noimg{aspect-ratio:auto;height:60px}
.prize-img.big.noimg{height:90px}
.toast{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px))}
.pcard .keep{font-size:12px;opacity:.6;margin:-8px 0 14px;max-width:38ch}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--ink2);font-weight:600;padding:4px 0}
.cal .d{min-height:48px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}
.cal .d.off{background:none;border-color:transparent}
.cal .d.hoy{border-color:var(--violet);color:var(--violet);font-weight:700}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--violet);flex-shrink:0}
.dot.cumple{background:var(--warn)}.dot.aniversario{background:var(--ok)}.dot.otro{background:var(--ink2)}
.evrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.evrow:last-child{border-bottom:0}.evd{min-width:30px;text-align:center;font-weight:700;font-size:18px}
.f textarea{width:100%;min-height:84px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font:inherit;resize:vertical}
.dot.turno{background:#C084FC}
.gate{text-align:center}.gate form,.gate .f{text-align:left}
.hero-logo{width:132px;height:132px;border-radius:32px;object-fit:cover;margin:0 auto 14px;display:block;border:1px solid var(--line);box-shadow:0 14px 36px rgba(0,0,0,.35)}
.hero-logo.mono{display:flex;align-items:center;justify-content:center;font:700 46px var(--f-display);background:var(--violet-s);color:var(--violet);box-shadow:none}
.hero-name{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin-bottom:28px}
.gate h1{font-size:26px;margin-bottom:8px}.gate .lead{margin-bottom:22px}
.gate form.stack{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.cal button.d{font:inherit;color:inherit;cursor:pointer}.cal .d.sel{background:var(--violet);border-color:var(--violet);color:#fff}

/* agenda pública */
.ag{max-width:640px}
.ag-rubros,.ag-filtro{margin-bottom:-4px}
.ag-prox{align-items:center}
.ag-cab{align-items:flex-start;gap:10px 12px;flex-wrap:wrap}.ag-cab .grow{flex:1 1 170px}
.ag-next{display:flex;flex-direction:column;align-items:flex-end;padding:6px 12px;border-radius:12px;background:var(--ok-s);color:var(--ok);font-size:13px;line-height:1.2;min-height:44px;justify-content:center}
.ag-next b{font-weight:700;text-transform:capitalize}
.ag-next span{font-variant-numeric:tabular-nums;font-weight:650}
.ag-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.ag-head span{text-align:center;font-size:12px;font-weight:650;color:var(--ink2);padding-bottom:4px}
.ag-cell{position:relative;min-height:54px;border-radius:10px;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--field);font-variant-numeric:tabular-nums}
.ag-cell.off{background:none}
.ag-cell b{font-size:15px;font-weight:650;line-height:1}

}

/* ═════ mejoras (animaciones, tarjeta viva, premios, cupones, recordatorios) ═════ */
:root{--teal:var(--violet);--teal-d:var(--violet-d);--teal-s:var(--violet-s);--surface:var(--card);--surface2:var(--field);--coral:#E8553F;--coral-t:#B73A27;--coral-s:#FDE7E2;--blue:#2F6FE4;--blue-s:#E3ECFC;--ok-t:#146B47;--r:20px;--r-s:14px;--shadow-s:0 1px 2px rgba(23,33,47,.08);--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme=dark]{--coral:#FF8A76;--coral-t:#FFA595;--coral-s:#3F211C;--blue:#6E9BF5;--blue-s:#1A2A47;--ok-t:#6FE5B1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic.lg{width:30px;height:30px}.ic.sm{width:18px;height:18px}

.qr-big-box canvas,.qr-big-box img{display:block;width:100%!important;height:auto!important}
.pcard .big b{display:inline-block;min-width:1ch}
.pcard.img{background:var(--card-bg)}
.pcard .perks{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.pcard .perks span{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800}
.mini-ph{display:grid;place-items:center;color:var(--violet)}
.mini-ph .ic{opacity:.55}
.mini-ph img{width:100%;height:100%;object-fit:cover}
.mini .btn{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.view.client-tabs{padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.rec-card .ic{flex-shrink:0}
.dayrow{border:2px solid var(--line);border-radius:var(--r-s);padding:12px 14px;background:var(--card)}
@media(prefers-reduced-motion:reduce){.pcard::before,.pcard::after,.pcard .shine,.pcard .spk,.pcard .star,.lt,.nav .ic,.bell .ic{animation:none!important}}
.wa-bubble{background:#DCF8C6;color:#17212F;border-radius:16px 16px 4px 16px;padding:12px 14px;white-space:pre-wrap;font-size:15px;box-shadow:var(--shadow-s)}
:root[data-theme=dark] .wa-bubble{background:#1F4D36;color:#EDF2F8}
@keyframes icwig{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.12)}60%{transform:rotate(10deg) scale(1.12)}}
@keyframes icpop{0%{transform:scale(.55)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ring{0%,50%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-14deg)}}
@keyframes snip{0%,84%,100%{transform:rotate(0)}89%{transform:rotate(-18deg)}94%{transform:rotate(12deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(.7em) rotate(5deg)}}
@keyframes glow{0%,100%{box-shadow:0 14px 34px rgba(47,111,228,.3)}50%{box-shadow:0 14px 44px rgba(107,75,224,.5)}}
.btn:hover .ic,.chip:hover .ic,.iconbtn:hover .ic,button.item:hover>.ic,.stat:hover .ic{animation:icwig .6s var(--ease)}
.nav button:hover .ic{animation:icwig .6s var(--ease)}
.nav button[aria-current=page] .ic{animation:icpop .5s var(--ease)}
.act .ico .ic{animation:float 3.4s ease-in-out infinite}
.act:nth-child(2) .ico .ic{animation-delay:.5s}.act:nth-child(3) .ico .ic{animation-delay:1s}.act:nth-child(4) .ico .ic{animation-delay:1.5s}
.act:hover .ico .ic{animation:icwig .6s var(--ease)}
.act.a-teal .ico .ic{animation:snip 3.4s ease-in-out infinite}

.stamp.on .ic{animation:snip 3.4s ease-in-out infinite}
.stamp.on:nth-child(2){animation-delay:.08s}.stamp.on:nth-child(3){animation-delay:.16s}.stamp.on:nth-child(4){animation-delay:.24s}.stamp.on:nth-child(5){animation-delay:.32s}.stamp.on:nth-child(6){animation-delay:.4s}.stamp.on:nth-child(7){animation-delay:.48s}
.stamp.gift .ic{animation:float 2.4s ease-in-out infinite}
.bell.has .ic{animation:ring 2.6s ease-in-out infinite;transform-origin:50% 8%}
.bell{position:relative}
.bdg{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:99px;background:var(--coral);color:#fff;font-size:11px;font-weight:800;font-style:normal;display:grid;place-items:center;padding:0 4px}
.dotn{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:99px;background:var(--coral);color:#fff;font-size:11px;font-weight:800;margin-left:6px;font-style:normal;padding:0 4px;animation:icpop .4s var(--ease)}
.success .check .ic path{stroke-dasharray:32;stroke-dashoffset:32;animation:draw .5s .25s ease-out forwards}
.logo-xl{animation:float 4s ease-in-out infinite,glow 3.4s ease-in-out infinite}
.brandmark{animation:float 4.2s ease-in-out infinite}
.w{display:inline-block;white-space:nowrap}

.still .stamp,.still .bars i,.still .success .check,.still .lt,.still .nav .ic{animation:none!important}
.still .success .check .ic path{animation:none;stroke-dashoffset:0}
.sr:focus-visible{outline:none}
label.btn:focus-within{outline:3px solid var(--blue);outline-offset:2px}
/* tarjeta viva */
.pcard{background:var(--card-bg,linear-gradient(135deg,#0B7C86,#2F6FE4 55%,#6B4BE0));text-shadow:0 1px 2px rgba(0,0,0,.22)}
.pcard.anim{background-size:240% 240%;animation:bgshift 14s ease-in-out infinite}
@keyframes bgshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.pcard::before{animation:drift 9s ease-in-out infinite alternate}
.pcard::after{animation:drift 11s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-26px,22px) scale(1.15)}}
.pcard .shine{position:absolute;top:0;bottom:0;left:-45%;width:28%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-18deg);animation:sweep 7s ease-in-out infinite;z-index:1;pointer-events:none}
@keyframes sweep{0%,55%{left:-45%}100%{left:140%}}

.pcard .spk.s1{left:52%;top:56%}.pcard .spk.s2{left:9%;top:42%;animation-delay:1.2s}.pcard .spk.s3{left:82%;top:76%;animation-delay:2.4s}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.95;transform:scale(1.1) rotate(45deg)}}
.pcard .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.2;animation:tw2 2.6s ease-in-out infinite;pointer-events:none;z-index:1}
@keyframes tw2{50%{opacity:1;transform:scale(1.8)}}
.pcard.lightbg{color:#17212F;text-shadow:none}.pcard.lightbg h2{color:#17212F}.pcard.lightbg .lvl{background:rgba(255,255,255,.55)}.pcard.lightbg .bar{background:rgba(23,33,47,.18)}.pcard.lightbg .bar i{background:#17212F}.pcard.lightbg .steps span{background:rgba(255,255,255,.5)}.pcard.lightbg .steps span.on{background:#17212F;color:#fff}
.perks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.perks span{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);padding:3px 10px 3px 7px;border-radius:99px;font-size:12.5px;font-weight:800}
.perks .ic{width:14px;height:14px}
.lvl small{text-shadow:none}
.pcard .big b{text-shadow:0 2px 8px rgba(0,0,0,.2)}
.fondo-prev{height:110px;border-radius:20px;box-shadow:var(--shadow-s)}
.fondos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* premios en miniatura */
.mgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.mgrid{grid-template-columns:1fr 1fr}}
.mini{display:flex;gap:14px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;transition:transform .2s var(--ease),box-shadow .2s}

.slide{--x:0px;position:relative;height:58px;border-radius:99px;background:var(--surface);border:2px solid var(--coral);margin-top:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none}
.slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:calc(var(--x) + 54px);background:var(--ok-s);transition:width .25s var(--ease)}

// Redimensiona y comprime en el navegador antes de subir (baja de MBs a ~50-150KB)
async function comprimirImagen(blob, maxAncho = 700, calidad = 0.72) {
  const bitmap = await createImageBitmap(blob);
  const escala = Math.min(1, maxAncho / bitmap.width);
  const w = Math.round(bitmap.width * escala), h = Math.round(bitmap.height * escala);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
  return new Promise(res => canvas.toBlob(res, 'image/jpeg', calidad));
}

/* ── consultas ── */
const getCli = id => S.clientes.find(c => c.id === id);
const nivelesOrd = () => [...S.niveles].sort((a, b) => a.desde - b.desde);

const valesDe = id => S.vales.filter(v => v.clienteId === id && v.estado === 'activo');

const digits = t => String(t || '').replace(/\D/g, '');
function waLink(tel, msg) {
  let d = digits(tel).replace(/^0+/, '');
  if (!d) return '';
  if (!d.startsWith('54')) d = '549' + d; else if (!d.startsWith('549')) d = '549' + d.slice(2);

}
function esCumpleMes(c) { if (!c.nacimiento) return false; return new Date(c.nacimiento + 'T12:00').getMonth() === new Date().getMonth(); }
function cumpleYaRegalado(c) { const y = new Date().getFullYear(); return S.movimientos.some(m => m.clienteId === c.id && m.tipo === 'cumple' && new Date(m.fecha).getFullYear() === y); }
function proxCumple(c) { if (!c.nacimiento) return 999; const n = new Date(c.nacimiento + 'T12:00'), h = new Date(); let p = new Date(h.getFullYear(), n.getMonth(), n.getDate()); if (p < new Date(h.getFullYear(), h.getMonth(), h.getDate())) p.setFullYear(h.getFullYear() + 1); return Math.round((p - h) / 864e5); }
function diasSinVenir(c) { const ref = c.ultimaVisita || c.creado; return Math.floor((Date.now() - new Date(ref)) / 864e5); }

/* ── reglas de puntos ── */
function puntosPorMonto(monto, c) { return Math.floor(Math.floor(monto / S.config.pesosPorPunto) * nivelDe(c).mult); }

function addMov(c, m) {
  S.movimientos.push({ id: uid(), clienteId: c.id, fecha: m.fecha || new Date().toISOString(), tipo: m.tipo, puntos: m.puntos || 0, monto: m.monto || 0, detalle: m.detalle || '' });

  if ((m.puntos || 0) > 0) c.ptsTotales += m.puntos;
}
function genCode() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let code;
  do { code = 'PL-' + Array.from({ length: 6 }, () => A[Math.random() * A.length | 0]).join(''); } while (S.clientes.some(x => x.codigo === code));
  return code;
}
const codigoCanje = () => 'C-' + Math.random().toString(16).slice(2, 6).toUpperCase();
function crearCliente(d, fecha) {
  const c = { id: uid(), codigo: genCode(), nombre: d.nombre.trim(), telefono: d.telefono || '', nacimiento: d.nacimiento || '', referidoPor: d.referidoPor || '', notas: d.notas || '', creado: fecha || new Date().toISOString(), puntos: 0, ptsTotales: 0, visitas: 0, sellos: 0, ultimaVisita: '' };
  S.clientes.push(c);

function registrarVisita(cid, o) {

  const nombres = (o.servIds || []).map(id => (S.servicios.find(s => s.id === id) || {}).nombre).filter(Boolean);
  addMov(c, { tipo: 'visita', puntos: g, monto: o.monto, detalle: nombres.join(' + ') || 'Visita', fecha: when });
  out.ganados += g;
  const primera = c.visitas === 0;
  c.visitas++; c.sellos++; c.ultimaVisita = when;

  const nivelDespues = nivelDe(c);
  if (nivelDespues.desde > nivelAntes.desde) out.notas.push('Subió al nivel ' + nivelDespues.nombre);

}

const newId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : uid() + uid() + uid();

/* ── imágenes: se reducen antes de subir ── */
function reducirImagen(file, lado, calidad) {
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, lado / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? ok(b) : fail(new Error('img')), 'image/jpeg', calidad);
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('img')); };
    img.src = url;
  });
}
const blobADataURL = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });

async function rpc(name, args) { const { data, error } = await sb.rpc(name, args || {}); if (error) throw error; return data; }
const sbApi = {
  async init() {
    if (sb) return;
    if (!window.supabase) throw new Error('No se pudo cargar Supabase');
    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  },
  info: () => rpc('pub_info', { p_slug: NEGOCIO_SLUG }),
  clienteVer: (c, t, slug) => rpc('cliente_ver', { p_slug: slug || NEGOCIO_SLUG, p_codigo: c, p_tel4: t }),

  clienteCanjear: (c, t, p) => rpc('cliente_canjear', { p_slug: NEGOCIO_SLUG, p_codigo: c, p_tel4: t, p_premio: p }),
  async staffLogin(email, pass) {
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pass });
    if (error) return false;
    try { await rpc('panel_estado'); return true; } catch (e) { await sb.auth.signOut(); return 'nostaff'; }
  },
  async staffSession() { const { data } = await sb.auth.getSession(); return !!(data && data.session); },
  async staffLogout() { if (this._ch) { sb.removeChannel(this._ch); this._ch = null; } await sb.auth.signOut(); },
  async estado() { const d = await rpc('panel_estado'); d.demo = false; return d; },
  agendaPub: () => rpc('pub_agenda', {}),
  agendaCfg: () => rpc('panel_agenda_leer'),
  guardarAgenda: p => rpc('panel_agenda_guardar', { p }),
  guardarCliente: d => {
    // No mandar campos vacíos: un "" en un campo uuid/date rompe la función SQL (22P02 / 22007).
    const p = {}; Object.keys(d).forEach(k => { if (d[k] !== undefined && d[k] !== null && d[k] !== '') p[k] = typeof d[k] === 'string' ? d[k].trim() : d[k]; });
    return rpc('panel_guardar_cliente', { p });
  },
  registrarVisita: (cid, o) => rpc('panel_registrar_visita', { p_cliente: cid, p_servicios: o.servIds || [], p_monto: o.monto, p_cumple: !!o.cumple, p_premio: o.premioId || null, p_vale: o.valeId || null }),
  ajustar: (cid, pts, motivo) => rpc('panel_ajustar', { p_cliente: cid, p_pts: pts, p_motivo: motivo }),
  canjeResolver: (id, accion) => rpc('panel_canje_resolver', { p_id: id, p_accion: accion }),
  guardarServicio: d => rpc('panel_guardar_servicio', { p: d }),
  guardarPremio: d => rpc('panel_guardar_premio', { p: d }),
  guardarNivel: n => rpc('panel_guardar_nivel', { p: n }),
  guardarConfig: o => rpc('panel_guardar_config', { p: o }),
  borrar: (tabla, id) => rpc('panel_borrar', { p_tabla: tabla, p_id: id }),
  eventos: () => rpc('panel_eventos_listar'),
  extras: () => rpc('panel_extra_leer'),
  guardarExtra: o => rpc('panel_extra_guardar', { p: o }),
  pubExtras: () => rpc('pub_extras'),
  turnos: () => rpc('panel_turnos_listar'),
  guardarTurno: d => rpc('panel_turno_guardar', { p: d }),
  borrarTurno: id => rpc('panel_turno_borrar', { p_id: id }),
  guardarEvento: d => rpc('panel_evento_guardar', { p: d }),
  borrarEvento: id => rpc('panel_evento_borrar', { p_id: id }),
  async subirImagen(blob) {
    const comprimida = await comprimirImagen(blob);
    const path = newId() + '.jpg';
    const { error } = await sb.storage.from('premios').upload(path, comprimida, { contentType: 'image/jpeg', upsert: false, cacheControl: '31536000' });
    if (error) throw new Error('No se pudo subir la imagen: ' + error.message);
    return sb.storage.from('premios').getPublicUrl(path).data.publicUrl;
  },
  async borrarImagen(url) {
    if (!url) return;
    const marca = '/object/public/premios/';
    const i = url.indexOf(marca);
    if (i < 0) return; // imagen vieja de otro lado: no la tocamos
    try {
      await sb.storage.from('premios').remove([decodeURIComponent(url.slice(i + marca.length))]);
    } catch (e) { /* si falla no bloqueamos al usuario */ }
  },
  suscribir(cb) {
    if (this._ch) return;
    this._ch = sb.channel('pelu-equipo');
    ['canjes', 'clientes', 'movimientos'].forEach(t => this._ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, cb));
    this._ch.subscribe();
  }
};

function itemsMes(y, m) {
  const out = [];
  S.clientes.forEach(c => { if (c.nacimiento) { const d = new Date(c.nacimiento + 'T12:00'); if (d.getMonth() === m) out.push({ dia: d.getDate(), tipo: 'cumple', t: 'Cumple de ' + c.nombre, cid: c.id }); } });

/* Horas ofrecidas en el panel para una fecha, según el horario de cada día (tramos separados por 'tramo') */

}
function horaChipsHTML(fecha, hora, id) {

function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
function mountQR(root = document) {
  if (typeof QRCode === 'undefined') return;
  root.querySelectorAll('[data-qr]').forEach(el => {
    if (el.dataset.done) return; el.dataset.done = '1'; el.innerHTML = '';
    try { new QRCode(el, { text: el.dataset.qr, width: +el.dataset.qrsize || 156, height: +el.dataset.qrsize || 156, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { el.innerHTML = `<span>${esc(el.dataset.qr)}</span>`; }
  });
}
function render() {
  const root = $('#root');
  if (ui.mode === 'boot') root.innerHTML = '<div class="gate"><p class="muted" role="status">Cargando…</p></div>';
  else if (ui.mode === 'plogin') root.innerHTML = panelLoginHTML();
  else if (ui.mode === 'cliente' && S && getCli(ui.kiosk)) root.innerHTML = clienteView(getCli(ui.kiosk));
  else if (ui.mode === 'panel' && S) root.innerHTML = staffShell();
  else if (ui.mode === 'agenda') root.innerHTML = agendaHTML();
  else if (ui.mode === 'cuenta' && ui.cuenta) root.innerHTML = cuentaHTML();
  else { ui.mode = 'gate'; root.innerHTML = gateHTML(); }
  mountQR(root); aplicarIcono(); animar(); abrirRecordAuto();
}

function actualizarBadge() {

}

function openSheet(title, html, onMount) {
  closeSheet();
  const el = document.createElement('div'); el.className = 'scrim'; el.id = 'scrim';
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="iconbtn" data-a="cerrar" aria-label="Cerrar">${svg('x')}</button></header>${html}</div>`;
  el.addEventListener('click', e => { if (e.target === el) closeSheet(); });

}

    for (let t = toMin(r[0]); t + dur <= toMin(r[1]); t += dur) {
      if (!conPasado && esHoy && t <= minAhora) continue;

const agLocales = () => ((AGP.data && AGP.data.locales) || []).filter(l => !AGP.rubro || l.rubro === AGP.rubro);
const agVisibles = () => agLocales().filter(l => !AGP.local || l.id === AGP.local);
function agDias() { const o = [], hoy = new Date(); hoy.setHours(0, 0, 0, 0); for (let i = 0; i < 28; i++) o.push(isoD(new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + i))); return o; }
function agProximo(loc) { for (const f of agDias()) { const s = slotsDe(loc, f).find(x => x.libre); if (s) return { f, h: s.h }; } return null; }
function agResumenDia(f, locs) { let libres = 0, total = 0; locs.forEach(l => { const s = slotsDe(l, f); total += s.length; libres += s.filter(x => x.libre).length; }); return { libres, total }; }

async function cargarAgendaPub() {
  AGP.err = '';
  try {
    AGP.data = await api.agendaPub() || { locales: [] };
    const rubros = [...new Set(AGP.data.locales.map(l => l.rubro))];
    if (!rubros.includes(AGP.rubro)) AGP.rubro = rubros.includes('peluqueria') ? 'peluqueria' : (rubros[0] || '');
    AGP.local = '';
    const primero = agDias().find(f => agResumenDia(f, agVisibles()).libres > 0);
    AGP.dia = primero || agDias()[0];
  } catch (e) {
    console.error(e); AGP.data = { locales: [] };
    AGP.err = (e && (e.code === 'PGRST202' || e.code === '42883')) ? 'falta' : 'red';

}

    if (location.hash === '#agenda') { await cargarAgendaPub(); ui.mode = 'agenda'; }
    else if (location.hash === '#panel') {
      if (await api.staffSession()) { await cargarPanel(); ui.mode = 'panel'; api.suscribir(onRemoto); } else ui.mode = 'plogin';

}

let scanStream = null, scanRaf = 0;
function stopScan() { cancelAnimationFrame(scanRaf); if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; } }
function abrirScan() {
  openSheet('Escanear tarjeta', `<video class="video" id="scan-video" playsinline muted></video><p class="hint" id="scan-msg">Apuntá al código QR de la tarjeta del cliente.</p>`, async () => {
    const msg = $('#scan-msg');
    if (!('BarcodeDetector' in window) || !navigator.mediaDevices) { msg.textContent = 'Este navegador no puede escanear. Buscá al cliente por su código (PL-XXXXXX) o nombre.'; return; }
    try {
      const det = new BarcodeDetector({ formats: ['qr_code'] });
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = $('#scan-video'); v.srcObject = scanStream; await v.play();
      const tick = async () => {
        if (!scanStream) return;
        try { const r = await det.detect(v); if (r.length) { const c = S.clientes.find(x => x.codigo === r[0].rawValue.trim()); if (c) { closeSheet(); ui.reg.cid = c.id; renderView(); toast('Tarjeta de ' + c.nombre); return; } msg.textContent = 'Ese código no es de ningún cliente. Probá de nuevo.'; } } catch (e) {}
        scanRaf = requestAnimationFrame(tick);
      };
      tick();
    } catch (e) { msg.textContent = 'No pudimos abrir la cámara. Revisá el permiso del navegador o buscá por nombre.'; }
  });
}

function errorAmigable(err) {

}

document.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault(); if (ocupado) return;
  const d = Object.fromEntries(new FormData(f)), btn = f.querySelector('button[type=submit]'), txt = btn && btn.textContent;
  ocupado = true; if (btn) { btn.disabled = true; btn.textContent = 'Un momento…'; }
  try {
    if (f.id === 'f-lookup') {
      const tel4 = digits(d.tel4), crudo = String(d.codigo || '').trim().replace(/\s+/g, ''), cand = [normCodigo(d.codigo)];
      /* si el código del cliente tiene minúsculas, probamos también tal cual lo escribió */
      const tal = /^pl-?/i.test(crudo) ? 'PL-' + crudo.replace(/^pl-?/i, '') : crudo;
      if (tal && !cand.includes(tal)) cand.push(tal);
      let entro = false;
      for (const cd of cand) { if (await entrarCuenta(cd, tel4, SLUG_URL)) { entro = true; break; } }
      if (!entro) { toast('El código y los dígitos no coinciden. Revisalos o preguntá en el local.'); return; }
      try { history.replaceState(null, '', location.pathname); } catch (x) {} render(); window.scrollTo(0, 0);
    } else if (f.id === 'f-plogin') {
      const ok = await api.staffLogin(d.email, d.pass);
      if (ok === 'nostaff') { toast('Ese usuario no tiene permiso para el panel. Pedile al administrador que lo habilite.'); return; }
      if (!ok) { toast(MODE === 'sb' ? 'Email o contraseña incorrectos' : 'PIN incorrecto'); return; }
      guardarModoPanel(true); await cargarPanel(); ui.mode = 'panel'; ui.tab = 'inicio'; api.suscribir(onRemoto); render();
    } else if (f.id === 'f-cli') {
      const c = await api.guardarCliente({ ...d, id: f.dataset.id || undefined });
      await recargar(); closeSheet();
      if (f.dataset.id) {
        if (d.genero) { const generos = Object.assign({}, EX.generos || {}); if (d.genero === 'F') generos[f.dataset.id] = 'F'; else delete generos[f.dataset.id]; EX.generos = generos; try { await api.guardarExtra({ generos }); } catch (e) {} }
        renderView(); toast('Cambios guardados');
      } else { ui.tab = 'clientes'; ui.cid = c.id; render(); toast('Cliente creado. Enviale la tarjeta por WhatsApp.'); }
    } else if (f.id === 'f-agenda') {
      const semana = {}, dias = [];
      for (let k = 0; k < 7; k++) {
        if (f.elements['on' + k] && f.elements['on' + k].checked) {
          const t = [[d['a1_' + k], d['c1_' + k]]];
          if (d['a2_' + k] || d['c2_' + k]) t.push([d['a2_' + k], d['c2_' + k]]);
          const nom = DIAS_N[k];
          if (t.some(r => !r[0] || !r[1])) { toast('Completá los dos horarios del ' + nom + ' (o dejá el segundo tramo vacío)'); return; }
          if (t.some(r => toMin(r[1]) <= toMin(r[0]))) { toast('El ' + nom + ': el horario de cierre debe ser posterior al de apertura'); return; }
          if (t[1] && toMin(t[1][0]) < toMin(t[0][1])) { toast('El ' + nom + ': el segundo tramo tiene que empezar después de que termina el primero'); return; }
          semana[k] = t; dias.push(k);
        } else semana[k] = [];
      }
      if (!dias.length) { toast('Elegí al menos un día de atención'); return; }
      const desde = toHM(Math.min(...dias.map(k => toMin(semana[k][0][0])))), hasta = toHM(Math.max(...dias.map(k => toMin(semana[k][semana[k].length - 1][1]))));
      AG = await api.guardarAgenda({ publica: d.publica === 'on', rubro: d.rubro, direccion: (d.direccion || '').trim(), wa: digits(d.wa), horario: { dias, desde, hasta, dur: +d.dur, semana } });
      if (AG && AG.horario && !AG.horario.semana && MODE === 'sb') { toast('Se guardó, pero el servidor no conservó los horarios por día. Hay que actualizar supabase-agenda.sql.'); AG = Object.assign({}, AG, { horario: Object.assign({}, AG.horario, { semana }) }); }
      renderView(); toast(d.publica === 'on' ? 'Agenda guardada y publicada' : 'Agenda guardada (no publicada)');
    } else if (f.id === 'f-turno') {
      if (!d.clienteId) { toast('Elegí un cliente'); return; }
      if (TUR.some(z => z.id !== f.dataset.id && z.fecha === d.fecha && z.hora === d.hora)) { toast('Ya hay un turno a esa hora'); return; }
      await api.guardarTurno({ id: f.dataset.id || newId(), clienteId: d.clienteId, fecha: d.fecha, hora: d.hora, detalle: (d.detalle || '').trim() });
      await recargar(); closeSheet(); renderView(); toast('Turno guardado');
    } else if (f.id === 'f-evento') {
      await api.guardarEvento({ id: f.dataset.id || newId(), titulo: d.titulo.trim(), fecha: d.fecha, tipo: d.tipo, anual: d.anual === 'on', clienteId: d.clienteId || '', notas: (d.notas || '').trim() });
      await recargar(); closeSheet(); renderView(); toast('Evento guardado');
    } else if (f.id === 'f-aviso') {
      const id = f.dataset.id, c = getCli(id), texto = $('#av-texto').value, sel = $('#av-plantilla');
      const url = waLink(c.telefono, texto);
      if (!url) { toast('Este cliente no tiene teléfono cargado'); return; }
      window.open(url, '_blank', 'noopener');
      const wantF = $('#av-mujer').checked, generos = Object.assign({}, EX.generos || {});
      if (wantF) generos[id] = 'F'; else delete generos[id];
      EX.generos = generos;
      try { await api.guardarExtra({ generos }); } catch (e) {}
      await marcarAviso(c, sel ? sel.value : '');
      closeSheet(); renderView(); toast('Mensaje enviado');
    } else if (f.id === 'f-plantilla') {
      if (!d.m || !d.m.trim()) { toast('Escribí el mensaje'); return; }
      const todas = plantillasTodas().slice(), id = f.dataset.id || newId();
      const obj = { id, m: d.m.trim(), f: (d.f || '').trim(), activo: !!d.activo };
      const i = todas.findIndex(x => x.id === id);
      if (i >= 0) todas[i] = obj; else todas.push(obj);
      const r = reactivCfg(); r.plantillas = todas; EX.reactiv = r;
      await api.guardarExtra({ reactiv: r });
      closeSheet(); renderView(); toast('Mensaje guardado');
    } else if (f.id === 'f-ajuste') {
      const p = parseInt(d.pts, 10);
      if (!p) { toast('Ingresá un número distinto de cero'); return; }
      if (!(await api.ajustar(f.dataset.id, p, d.motivo))) { toast('No alcanzan los puntos para restar tanto'); return; }
      await recargar(); closeSheet(); renderView(); toast('Ajuste aplicado');
    } else if (f.id === 'f-serv') {
      await api.guardarServicio({ id: f.dataset.id || newId(), nombre: d.nombre.trim(), precio: Math.max(0, parseInt(d.precio, 10) || 0) });
      await recargar(); closeSheet(); renderView(); toast('Servicio guardado');
    } else if (f.id === 'f-premio') {
      const id = f.dataset.id, previo = id ? (S.premios.find(x => x.id === id) || {}).imagen || '' : '';
      let imagen = ui.img.quitar ? '' : previo;
      if (ui.img.blob) imagen = await api.subirImagen(ui.img.blob);
      await api.guardarPremio({ id: id || newId(), nombre: d.nombre.trim(), descripcion: (d.descripcion || '').trim(), costo: Math.max(1, parseInt(d.costo, 10) || 1), imagen, activo: !!d.activo });
      if (previo && previo !== imagen) api.borrarImagen(previo).catch(() => {});
      await recargar(); closeSheet(); renderView(); toast('Premio guardado');
    }
  } catch (err) { toast(errorAmigable(err)); }
  finally { ocupado = false; if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = txt; } }
});

document.addEventListener('change', async e => {
  const t = e.target;
  try {
    if (t.name === 'fecha' && t.closest && t.closest('#f-turno')) {
      const f = t.closest('#f-turno'), hi = f.querySelector('[name=hora]'), sl = horasPanel(t.value, f.dataset.id), libres = sl.filter(x => !x.tomada);
      if (libres.length && !sl.some(x => x.h === hi.value)) hi.value = libres[0].h;

    }
    if (t.dataset.reg) { const k = t.dataset.reg; ui.reg[k] = t.type === 'checkbox' ? t.checked : t.value; $('#reg-preview').innerHTML = regPreviewHTML(); return; }
    if (t.id === 'av-plantilla' || t.id === 'av-mujer') { actualizarPreviewAviso(); return; }

    }

      catch (x) { toast('No pudimos leer esa imagen. Probá con otra (JPG o PNG).'); }

      let url; try { url = await blobADataURL(await reducirImagen(t.files[0], 300, 0.85)); } catch (x) { toast('No pudimos leer esa imagen. Probá con otra (JPG o PNG).'); return; }
      try { await api.guardarExtra({ logo: url }); }
      catch (x) { console.error(x); toast(x && (x.code === 'PGRST202' || x.code === '42883') ? 'Falta ejecutar supabase-eventos.sql en Supabase (SQL Editor) para poder guardar el logo.' : errorAmigable(x)); return; }
      EX.logo = url; try { await api.guardarConfig({ logo: url }); } catch (x) {}
      S.config.logo = url; icoKey = ''; toast('Logo guardado'); render(); return;
    }
    if (t.dataset.ex) { const k = t.dataset.ex, v = t.type === 'checkbox' ? t.checked : t.value.trim(); await api.guardarExtra({ [k]: v }); EX[k] = v; if (k === 'turnos' && v) { try { TUR = await api.turnos(); } catch (x) {} } toast('Guardado'); if (k === 'turnos' || k === 'horIgual') render(); return; }
    if (t.dataset.cfg) {
      const k = t.dataset.cfg, txt = ['salon', 'pin', 'valeSellos', 'tipo'].includes(k);
      const v = txt ? t.value.trim() : Math.max(k === 'sellosMeta' || k === 'pesosPorPunto' ? 1 : 0, parseInt(t.value, 10) || 0);
      if (txt && !v) { t.value = S.config[k]; toast('Este dato no puede quedar vacío'); return; }
      await api.guardarConfig({ [k]: v }); S.config[k] = v; if (!txt) t.value = v; if (k === 'salon') SALON = v; toast('Guardado'); if (k === 'salon' || k === 'tipo') render(); return;
    }
    if (t.dataset.nivel) {
      const n = S.niveles.find(x => x.id === t.dataset.nivel), k = t.dataset.k; let v = t.value;

      try { const d = JSON.parse(txt); if (!d || !Array.isArray(d.clientes) || !d.config) throw 0; d.canjes = d.canjes || []; D = d; DB.save(D); await recargar(); ui.cid = null; regReset(); render(); toast('Copia restaurada'); } catch (x) { toast('Ese archivo no es una copia válida'); }
    }
  } catch (err) { toast(errorAmigable(err)); }
});

/* ── ícono de la app = logo del negocio (favicon, ícono de iPhone y de Android al instalar) ── */
let icoKey = '';
async function aplicarIcono() {
  const url = logoURL() || LOGO_PUB; if (!url || url === icoKey) return; icoKey = url;
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const mk = (n, pad) => { const c = document.createElement('canvas'); c.width = c.height = n; const x = c.getContext('2d'); x.fillStyle = '#101215'; x.fillRect(0, 0, n, n);
      const a = n * (1 - 2 * pad), r = pad ? Math.min(a / img.width, a / img.height) : Math.max(n / img.width, n / img.height), w = img.width * r, h = img.height * r; x.drawImage(img, (n - w) / 2, (n - h) / 2, w, h); return c.toDataURL('image/png'); };
    const i192 = mk(192, 0), i512 = mk(512, 0), imk = mk(512, 0.12), i180 = mk(180, 0);
    document.querySelectorAll('link[rel="icon"]').forEach(l => { l.type = 'image/png'; l.removeAttribute('sizes'); l.href = i192; });
    document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(l => { l.href = i180; });
    const st = new URL('./', location.href).href, nom = salonNombre();
    const man = { name: nom + ' · Puntos', short_name: nom.slice(0, 12), description: 'Tu tarjeta de puntos', lang: 'es-AR', start_url: st, scope: st, display: 'standalone', orientation: 'portrait', background_color: '#F4F7FB', theme_color: '#0B7C86',
      icons: [{ src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' }, { src: imk, sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
    const l = document.querySelector('link[rel="manifest"]'); if (l) l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' }));
  } catch (e) { icoKey = ''; }
}
