<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Directorio de comercios</title>
<meta name="description" content="Encontrá gomerías, cafeterías, peluquerías y más comercios cerca tuyo. Mirá si están abiertos y escribí por WhatsApp o llamá con un toque.">
<meta name="theme-color" content="#FFD21F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Directorio">
<meta property="og:type" content="website">
<meta property="og:title" content="Directorio de comercios">
<meta property="og:description" content="Gomerías, cafeterías, peluquerías y más, con horarios, WhatsApp y mapa.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FFD21F'/%3E%3Cpath d='M32 10c-9 0-16 7-16 16 0 11 16 28 16 28s16-17 16-28c0-9-7-16-16-16z' fill='%230B1B4D'/%3E%3Ccircle cx='32' cy='26' r='6' fill='%23FFD21F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,700..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --amar:#FFD21F; --navy:#0B1B4D; --papel:#F4F7FF; --tinta:#0B1B4D; --tinta-2:#45527A; --linea:#D3DAEE;
  --ok:#0B7A45; --ok-bg:#D8F6E5; --pronto:#A14F00; --pronto-bg:#FFE7CC; --no:#B3261E; --no-bg:#FFE0DC; --nd-bg:#E8ECF4;
  --wa:#0F8F48; --tel:#1D5FD6;
  --f-titulo:'Archivo','Arial Black','Helvetica Neue',Arial,sans-serif;
  --f-texto:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-texto);font-size:18px;line-height:1.4;color:var(--tinta);background:var(--papel);min-height:100vh;padding-bottom:var(--safe-b)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:4px solid var(--navy);outline-offset:2px;box-shadow:0 0 0 7px #fff}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-style:normal}

/* ---------- botones tipo "tecla" ---------- */
.btn{min-height:60px;padding:0 18px;border-radius:16px;border:0;background:#fff;color:var(--navy);font-weight:700;font-size:19px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center;box-shadow:0 5px 0 rgba(11,27,77,.28),inset 0 0 0 3px var(--navy);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(11,27,77,.28),inset 0 0 0 3px var(--navy)}
.btn .emo{font-size:26px}
.btn.wa{background:var(--wa);color:#fff;box-shadow:0 5px 0 #09592D}
.btn.wa:active{box-shadow:0 1px 0 #09592D}
.btn.tel{background:var(--tel);color:#fff;box-shadow:0 5px 0 #123E8E}
.btn.tel:active{box-shadow:0 1px 0 #123E8E}
.btn.pri{background:var(--navy);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn.am{background:var(--amar);box-shadow:0 5px 0 #A88800,inset 0 0 0 3px var(--navy)}
.btn.peligro{background:#fff;color:var(--no);box-shadow:0 5px 0 rgba(179,38,30,.35),inset 0 0 0 3px var(--no)}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45;pointer-events:none}

/* ---------- cabecera ---------- */
.hero{background:var(--amar);color:var(--navy);padding:calc(12px + var(--safe-t)) 0 22px;border-bottom:6px solid var(--navy)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-titulo);font-weight:900;font-size:19px;line-height:1.05;text-decoration:none}
.brand small{display:block;font-family:var(--f-texto);font-weight:700;font-size:15px;margin-top:2px}
.brand svg{width:40px;height:40px}
.btn-inst{min-height:48px;padding:0 14px;border-radius:14px;border:3px solid var(--navy);background:transparent;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.hero h1{font-family:var(--f-titulo);font-stretch:118%;font-weight:900;font-size:clamp(38px,11vw,68px);line-height:1;letter-spacing:-.015em;margin-bottom:16px}
.busq{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--navy);border-radius:18px;padding:0 8px 0 14px;height:66px}
.busq input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:20px;height:100%}
.busq input::placeholder{color:#6B7893}
.busq:focus-within{box-shadow:0 0 0 5px #fff,0 0 0 8px var(--navy)}
.busq .ic{width:46px;height:46px;border-radius:50%;border:0;background:var(--navy);color:#fff;display:none;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.busq .ic.on,.busq.lleno .limpiar{display:flex}
.busq .limpiar{background:var(--nd-bg);color:var(--navy);display:none}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.chip{min-height:58px;padding:0 10px;border-radius:16px;border:3px solid var(--navy);background:#fff;font-weight:700;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 rgba(11,27,77,.28)}
.chip .emo{font-size:26px}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff}
.chip[aria-pressed="true"]::after{content:"✓";font-weight:900}

/* ---------- avisos ---------- */
.aviso{background:#fff;border-bottom:3px solid var(--navy);font-size:16px;padding:10px 0}
.aviso .wrap{display:flex;gap:10px;align-items:flex-start}
.aviso .emo{font-size:22px}

/* ---------- categorías ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:22px 0 6px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:156px;padding:14px 14px 16px;background:var(--c);color:#fff;border-radius:22px;text-decoration:none;box-shadow:0 7px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(6px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.tile .e{font-size:68px;line-height:1;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.tile b{font-family:var(--f-titulo);font-weight:900;font-size:22px;line-height:1.05;display:block;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.tile .n{position:absolute;top:12px;right:12px;min-width:34px;height:34px;padding:0 8px;border-radius:17px;background:#fff;color:var(--navy);font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center}
.tile[aria-current="true"]{outline:5px solid var(--navy);outline-offset:3px}

/* ---------- resultados ---------- */
.cab-res{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 14px;flex-wrap:wrap}
.cab-res h2{font-family:var(--f-titulo);font-stretch:112%;font-weight:900;font-size:28px;line-height:1.05}
.cab-res p{color:var(--tinta-2);font-size:16px}
.lista{display:grid;gap:16px;grid-template-columns:1fr;padding-bottom:32px}
.card{position:relative;background:#fff;border:3px solid var(--navy);border-radius:22px;overflow:hidden;box-shadow:0 6px 0 rgba(11,27,77,.2)}
.card.oculto{border-style:dashed;opacity:.8}
.card-link{display:flex;gap:14px;padding:14px 14px 10px;text-decoration:none;align-items:center}
.media{width:96px;height:96px;flex-shrink:0;border-radius:18px;overflow:hidden}
.foto,.foto-fb{width:96px;height:96px;display:flex;align-items:center;justify-content:center;object-fit:cover;border-radius:18px}
.foto-fb{font-size:54px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.info{min-width:0;flex:1;padding-right:44px}
.card h3{font-family:var(--f-titulo);font-weight:900;font-size:22px;line-height:1.1;margin-bottom:8px}
.meta{display:flex;align-items:center;gap:6px;color:var(--tinta-2);font-size:16px;flex-wrap:wrap;margin-top:6px}
.voz{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:50%;border:3px solid var(--navy);background:var(--amar);font-size:22px;display:flex;align-items:center;justify-content:center}
.estado{display:inline-flex;align-items:center;gap:8px;font-size:17px;padding:4px 12px 4px 4px;border-radius:999px;font-weight:700;line-height:1.15}
.estado i{width:28px;height:28px;border-radius:50%;background:currentColor;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-style:normal}
.estado i::before{color:#fff;font-weight:900;font-size:17px}
.estado span{font-weight:400;font-size:15px}
.estado.si{color:var(--ok);background:var(--ok-bg)} .estado.si i::before{content:"✓"}
.estado.pronto{color:var(--pronto);background:var(--pronto-bg)} .estado.pronto i::before{content:"!"}
.estado.no{color:var(--no);background:var(--no-bg)} .estado.no i::before{content:"✕"}
.estado.nd{color:var(--tinta-2);background:var(--nd-bg)} .estado.nd i::before{content:"?"}
.estado b,.estado span{color:var(--navy)}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 14px 16px}
.tag-oculto{display:inline-block;background:var(--navy);color:#fff;font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-bottom:6px}

/* ---------- vacíos y carga ---------- */
.vacio{background:#fff;border:3px dashed #8E9CC0;border-radius:22px;padding:30px 20px;text-align:center;margin-bottom:32px}
.vacio .grande{font-size:64px;line-height:1;margin-bottom:10px;display:block}
.vacio h3{font-family:var(--f-titulo);font-weight:900;font-size:24px;margin-bottom:8px}
.vacio p{color:var(--tinta-2);max-width:42ch;margin:0 auto 18px}
.vacio .fila{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.esq{height:150px;border-radius:22px;background:linear-gradient(100deg,#E3E8F2 30%,#EEF2F9 50%,#E3E8F2 70%);background-size:300% 100%;animation:brillo 1.4s linear infinite}
@keyframes brillo{to{background-position:-300% 0}}

/* ---------- ficha ---------- */
.f-cab{background:var(--c,var(--navy));color:#fff;padding:calc(10px + var(--safe-t)) 0 24px;border-bottom:6px solid var(--navy)}
.volver{min-height:52px;padding:0 18px 0 12px;border-radius:16px;border:3px solid #fff;background:rgba(255,255,255,.16);color:#fff;font-weight:700;display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}
.portada{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:16px;-webkit-overflow-scrolling:touch}
.portada img{flex:0 0 100%;height:clamp(200px,45vw,340px);object-fit:cover;border-radius:20px;border:3px solid #fff;scroll-snap-align:center;background:rgba(255,255,255,.2)}
.portada.multi img{flex-basis:88%}
.f-cab .grande{font-size:80px;line-height:1;display:block;margin-bottom:6px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.f-cab h1{font-family:var(--f-titulo);font-stretch:112%;font-weight:900;font-size:clamp(32px,8vw,50px);line-height:1.03;margin-bottom:10px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.f-cab .meta{color:#fff;font-size:18px;margin-bottom:14px}
.f-cuerpo{display:grid;gap:20px;padding:22px 0 44px}
.galeria{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.galeria img{height:240px;width:auto;max-width:86vw;object-fit:cover;border-radius:20px;border:3px solid var(--navy);scroll-snap-align:center;flex-shrink:0;background:var(--nd-bg)}
.f-acc{display:grid;gap:12px}
.f-acc .btn{min-height:68px;font-size:21px}
.bloque{background:#fff;border:3px solid var(--navy);border-radius:22px;padding:18px}
.bloque h2{font-family:var(--f-titulo);font-weight:900;font-size:22px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.bloque h2 .emo{font-size:28px}
.fila-i{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:19px}
.fila-i .emo{font-size:26px}
.fila-i a{color:var(--tel);font-weight:700;word-break:break-word}
.tira{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.dia{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;background:var(--nd-bg);color:var(--tinta-2);font-weight:700;font-size:15px}
.dia span{font-size:20px;font-weight:900}
.dia.on{background:var(--ok-bg);color:var(--ok)}
.dia.hoy{outline:4px solid var(--navy);outline-offset:1px}
.horas{width:100%;border-collapse:collapse;font-size:18px}
.horas td{padding:8px 0;border-top:2px solid var(--linea);vertical-align:top}
.horas tr:first-child td{border-top:0}
.horas td:last-child{text-align:right}
.horas tr.hoy td{font-weight:700;color:var(--tel)}
.nota{font-size:15px;color:var(--tinta-2);margin-top:10px}

/* ---------- pie ---------- */
.pie{border-top:3px solid var(--navy);padding:22px 0 40px;color:var(--tinta-2);font-size:16px}
.pie .wrap{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.pie a,.pie .link{color:var(--tel);font-weight:700;background:none;border:0;font-size:16px;text-decoration:underline;min-height:44px}

/* ---------- editor ---------- */
.barra-ed{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;padding:calc(8px + var(--safe-t)) 0 10px;border-bottom:4px solid var(--amar)}
.barra-ed .wrap{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.barra-ed b{font-family:var(--f-titulo);font-weight:900;font-size:18px}
.barra-ed .chico{font-size:14px;opacity:.9;flex:1;min-width:160px}
.barra-ed .bt{display:flex;gap:8px;flex-wrap:wrap}
.barra-ed button{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid #fff;background:transparent;color:#fff;font-weight:700;font-size:16px}
.barra-ed button.am{background:var(--amar);color:var(--navy);border-color:var(--amar)}
.btn.editar{margin:0 14px 16px;width:calc(100% - 28px);min-height:52px;font-size:18px}

.velo{position:fixed;inset:0;background:rgba(8,16,48,.65);display:none;align-items:flex-end;justify-content:center;z-index:60}
.velo.abierto{display:flex}
.hoja{background:#fff;width:100%;max-width:600px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(24px + var(--safe-b))}
.hoja.grande{max-height:95vh}
.hoja h2{font-family:var(--f-titulo);font-weight:900;font-size:26px;margin-bottom:6px}
.hoja .sub{color:var(--tinta-2);margin-bottom:14px;font-size:16px}
.hoja h3{font-family:var(--f-titulo);font-weight:900;font-size:19px;margin:16px 0 6px}
.hoja ol{padding-left:24px;display:grid;gap:8px}
.hoja>.btn{width:100%;margin-top:18px}
.campo{display:grid;gap:5px;margin-top:14px}
.campo>label,.campo>.et{font-weight:700;font-size:17px}
.campo small{color:var(--tinta-2);font-size:14px}
.campo input[type=text],.campo input[type=password],.campo input[type=email],.campo input[type=url],.campo input[type=tel],.campo input[type=number],.campo select,.campo textarea{width:100%;min-height:52px;padding:10px 12px;border:3px solid var(--navy);border-radius:14px;background:#fff;font-size:18px}
.campo textarea{min-height:96px;resize:vertical}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fila-b{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.fila-b .btn{min-height:50px;font-size:16px;padding:0 14px;flex:1;min-width:140px}
.check{display:flex;align-items:center;gap:12px;font-weight:700;margin-top:14px;min-height:48px}
.check input{width:28px;height:28px;accent-color:var(--navy);flex-shrink:0}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px;margin-top:6px}
.emojis button{height:50px;border-radius:12px;border:2px solid var(--linea);background:#fff;font-size:28px}
.emojis button:hover{border-color:var(--navy)}
.icono-fila{display:flex;gap:10px;align-items:center}
.icono-fila input{flex:1}
.vista-ic{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--nd-bg);flex-shrink:0}
.colores{display:flex;gap:8px;flex-wrap:wrap}
.colores button{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--linea)}
.colores button[aria-pressed="true"]{box-shadow:0 0 0 4px var(--navy)}
.h-fila{display:grid;grid-template-columns:70px 1fr;gap:6px 10px;align-items:center;padding:8px 0;border-top:2px solid var(--linea)}
.h-fila b{font-size:16px}
.h-par{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.h-par input[type=time]{min-height:44px;padding:4px 8px;border:2px solid var(--navy);border-radius:10px;font-size:16px;background:#fff}
.prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.prev img{width:74px;height:74px;object-fit:cover;border-radius:12px;border:2px solid var(--navy)}
.err{background:var(--no-bg);color:var(--no);border:3px solid var(--no);border-radius:14px;padding:12px;margin-top:14px;font-weight:700;display:none}
.err.on{display:block}
.lista-cats{display:grid;gap:10px;margin-top:12px}
.cat-fila{display:flex;align-items:center;gap:12px;padding:10px 12px;border:3px solid var(--navy);border-radius:16px}
.cat-fila .vista-ic{color:#fff}
.cat-fila b{flex:1;font-size:19px}
.cat-fila button{min-height:46px;padding:0 14px;border-radius:12px;border:3px solid var(--navy);background:#fff;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:var(--navy);color:#fff;padding:14px 20px;border-radius:14px;font-size:17px;font-weight:700;z-index:80;max-width:calc(100% - 32px);display:none}
.toast.on{display:block}


/* ---------- iconos modernos ---------- */
.ic-svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
.ic-svg .f{fill:currentColor;fill-opacity:.2}
.tile .e .ic-svg .f{fill-opacity:.3}
.iconos .ic-svg .f{fill-opacity:.16}
.ic-emo{display:block;line-height:1}
.ic-meta{display:inline-flex;font-size:22px}
.tw{position:relative;display:flex}
.tw>.tile{flex:1;min-width:0}
.tile{overflow:hidden;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 80%,#fff) 0%,var(--c) 50%,color-mix(in srgb,var(--c) 70%,#000) 100%);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 55%,#000),0 14px 22px rgba(11,27,77,.16)}
.tile:active{box-shadow:0 1px 0 color-mix(in srgb,var(--c) 55%,#000),0 4px 8px rgba(11,27,77,.16)}
.tile::before{content:"";position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14)}
.tile::after{content:"";position:absolute;left:-44px;bottom:-64px;width:150px;height:150px;border-radius:50%;background:rgba(0,0,0,.08)}
.tile>*{position:relative;z-index:1}
.tile .e{width:64px;height:64px;border-radius:21px;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.42);display:flex;align-items:center;justify-content:center;font-size:38px;line-height:1;filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 12px rgba(0,0,0,.16)}
.tile .e .ic-svg{stroke-width:1.65;filter:drop-shadow(0 2px 2px rgba(0,0,0,.22))}
.tile .n{z-index:2;position:absolute}
.tile.mas{background:var(--navy);border:0;cursor:pointer;font:inherit;width:100%;text-align:left}
.tile.mas .e{font-family:var(--f-titulo);font-weight:900;font-size:26px}
.ver-menos{display:flex;margin:14px auto 0}

/* ---------- horarios ---------- */
const toMin = s => { const [a, b] = s.split(':').map(Number); return a * 60 + b; };
const fmt = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const rangos = (c, d) => (c.horarios && c.horarios[d]) || [];
const es24 = c => c.horarios && [0,1,2,3,4,5,6].every(d => rangos(c, d).length === 1 && rangos(c, d)[0][0] === '00:00' && rangos(c, d)[0][1] === '24:00');

function estado(c, now = new Date()) {
  if (!c.horarios || !Object.keys(c.horarios).length) return {abierto: null, clase: 'nd', corto: 'Sin horario', detalle: '', texto: 'Horario no informado'};
  if (es24(c)) return {abierto: true, clase: 'si', corto: 'Abierto', detalle: 'las 24 horas', texto: 'Abierto las 24 horas'};
  const d = now.getDay(), m = now.getHours() * 60 + now.getMinutes();
  const abre = (e) => e - m <= 60
    ? {abierto: true, clase: 'pronto', corto: 'Cierra pronto', detalle: 'a las ' + fmt(e), texto: 'Cierra pronto, a las ' + fmt(e)}
    : {abierto: true, clase: 'si', corto: 'Abierto', detalle: 'hasta las ' + fmt(e), texto: 'Abierto hasta las ' + fmt(e)};
  for (const [a, b] of rangos(c, d)) {
    const s = toMin(a); let e = toMin(b); if (e <= s) e += 1440;
    if (m >= s && m < e) return abre(e);
  }
  for (const [a, b] of rangos(c, (d + 6) % 7)) {
    const s = toMin(a), e = toMin(b);
    if (e <= s && m < e) return abre(e);
  }
  for (let i = 0; i < 8; i++) {
    const dd = (d + i) % 7;
    const aperturas = rangos(c, dd).map(r => toMin(r[0])).sort((x, y) => x - y);
    for (const s of aperturas) {
      if (i > 0 || s > m) {
        const cuando = (i === 0 ? 'hoy' : i === 1 ? 'mañana' : DIAS[dd].toLowerCase()) + ' ' + fmt(s);
        return {abierto: false, clase: 'no', corto: 'Cerrado', detalle: 'abre ' + cuando, texto: 'Cerrado, abre ' + cuando};
      }
    }
  }
  return {abierto: false, clase: 'no', corto: 'Cerrado', detalle: '', texto: 'Cerrado'};
}
const pill = c => { const e = estado(c); return `<span class="estado ${e.clase}"><i aria-hidden="true"></i><b>${esc(e.corto)}</b>${e.detalle ? `<span>${esc(e.detalle)}</span>` : ''}</span>`; };
function textoDia(c, d) {
  const r = rangos(c, d);
  if (!r.length) return 'Cerrado';
  if (r.length === 1 && r[0][0] === '00:00' && r[0][1] === '24:00') return 'Las 24 horas';
  return r.map(x => `${x[0]} a ${x[1]}`).join(' y ');
}

/* ---------- distancia ---------- */
function km(a, b) {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = k => k < 1 ? Math.round(k * 10) * 100 + ' m' : k.toFixed(1).replace('.', ',') + ' km';

  let im = r.imagenes; if (typeof im === 'string') { try { im = JSON.parse(im); } catch (e) { im = im.split(/\n|,/); } }
  const c = {...r, horarios: h || {}, imagenes: (Array.isArray(im) ? im : []).map(x => String(x).trim()).filter(Boolean),
    lat: r.lat == null || r.lat === '' ? null : Number(r.lat), lng: r.lng == null || r.lng === '' ? null : Number(r.lng),

/* ---------- API Supabase ---------- */
const API = {
  async req(method, path, body, extra) {
    const r = await fetch(CONFIG.supabaseUrl.replace(/\/$/, '') + '/rest/v1/' + path, {method,
      headers: {apikey: CONFIG.supabaseKey, 'Content-Type': 'application/json', Authorization: 'Bearer ' + (S.token || CONFIG.supabaseKey), ...(extra || {})},
      body: body ? JSON.stringify(body) : undefined});
    if (r.status === 401 || r.status === 403) throw new Error('SIN_PERMISO');
    if (!r.ok) throw new Error((await r.text()) || 'Error ' + r.status);
    return r.status === 204 ? null : r.json().catch(() => null);
  }
};
async function loginSupabase(email, clave) {
  const r = await fetch(CONFIG.supabaseUrl.replace(/\/$/, '') + '/auth/v1/token?grant_type=password', {method: 'POST',
    headers: {apikey: CONFIG.supabaseKey, 'Content-Type': 'application/json'}, body: JSON.stringify({email, password: clave})});
  if (!r.ok) throw new Error('CLAVE');
  const j = await r.json();
  S.token = j.access_token;
  try { sessionStorage.setItem('dir_tok', j.access_token); sessionStorage.setItem('dir_exp', String(Date.now() + (j.expires_in || 3600) * 1000 - 30000)); } catch (e) {}
}

const leerJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
async function cargarDatos() {
  if (remoto()) {
    try {
      const filtro = S.token ? '' : '&activo=eq.true';
      const [rows, cats] = await Promise.all([API.req('GET', 'comercios?select=*&order=nombre' + filtro), API.req('GET', 'categorias?select=*&order=orden').catch(() => null)]);
      if (!S.token) try { localStorage.setItem(CACHE_KEY, JSON.stringify({rows, cats})); } catch (e) {}
      return {rows, cats, demo: false};
    } catch (e) {
      if (e.message === 'SIN_PERMISO' && S.token) { limpiarSesion(); return cargarDatos(); }
      const c = leerJSON(CACHE_KEY);
      if (c && c.rows) return {rows: c.rows, cats: c.cats, demo: false, offline: true};
      return {rows: [], demo: false, error: true};
    }
  }
  const l = leerJSON(LOCAL_KEY);
  if (l && l.rows) return {rows: l.rows, cats: l.cats, demo: true, nVis: l.nVis};
  return {rows: DEMO, cats: CATS_BASE, demo: true};
}

  try { localStorage.setItem(LOCAL_KEY, JSON.stringify({rows: S.raw, cats: S.cats, nVis: S.nVis})); }

/* ---------- altas, cambios y bajas ---------- */
async function guardarComercio(campos, id) {
  if (remoto()) {
    let res;
    if (id) res = await API.req('PATCH', 'comercios?id=eq.' + encodeURIComponent(id), campos, {Prefer: 'return=representation'});
    else res = await API.req('POST', 'comercios', {...campos, slug: slugify(campos.nombre) + '-' + Math.random().toString(36).slice(2, 6)}, {Prefer: 'return=representation'});
    if (!res || !res.length) throw new Error('SIN_PERMISO');
    await recargar();
  } else if (id) {
    const i = S.raw.findIndex(x => String(x.id) === String(id));
    if (i < 0) throw new Error('No encontramos ese comercio.');
    S.raw[i] = {...S.raw[i], ...campos}; persistirLocal();
  } else {
    const nid = Date.now();
    S.raw.push({...campos, id: nid, slug: slugify(campos.nombre) + '-' + nid}); persistirLocal();
  }
}
async function borrarComercio(id) {
  if (remoto()) { await API.req('DELETE', 'comercios?id=eq.' + encodeURIComponent(id), null, {Prefer: 'return=representation'}); await recargar(); }
  else { S.raw = S.raw.filter(x => String(x.id) !== String(id)); persistirLocal(); }
}
async function guardarCategoria(k, esNueva) {
  if (remoto()) {
    const res = await API.req('POST', 'categorias', k, {Prefer: 'resolution=merge-duplicates,return=representation'});
    if (!res || !res.length) throw new Error('SIN_PERMISO');
    await recargar();
  } else {
    const i = S.cats.findIndex(x => x.id === k.id);
    if (i >= 0) S.cats[i] = {...S.cats[i], ...k}; else S.cats.push(k);
    persistirLocal();
  }
}
async function borrarCategoria(id) {
  if (S.raw.some(r => r.categoria === id)) throw new Error('Esta categoría tiene comercios. Cambiales la categoría antes de borrarla.');
  if (remoto()) { await API.req('DELETE', 'categorias?id=eq.' + encodeURIComponent(id), null, {Prefer: 'return=representation'}); await recargar(); }
  else { S.cats = S.cats.filter(x => x.id !== id); persistirLocal(); }

async function guardarOrden(ids) {
  const mapa = new Map(S.cats.map(k => [k.id, k]));
  const nuevo = ids.filter(id => mapa.has(id)).map(id => mapa.get(id));
  S.cats.forEach(k => { if (!ids.includes(k.id)) nuevo.push(k); });
  nuevo.forEach((k, i) => k.orden = i + 1);
  S.cats = nuevo;
  if (remoto()) {
    const filas = nuevo.map(k => ({id: k.id, nombre: k.nombre, singular: k.singular, icono: k.icono, color: k.color, palabras: k.palabras || [], orden: k.orden}));
    const res = await API.req('POST', 'categorias', filas, {Prefer: 'resolution=merge-duplicates,return=representation'});
    if (!res || !res.length) throw new Error('SIN_PERMISO');

  if (remoto()) {
    const res = await API.req('POST', 'categorias', {id: AJ_ID, nombre: 'Ajustes', singular: 'Ajustes', icono: '', color: '#000000', palabras: [], orden: n}, {Prefer: 'resolution=merge-duplicates,return=representation'});
    if (!res || !res.length) throw new Error('SIN_PERMISO');
  } else persistirLocal();
}

const tokens = q => norm(q).split(/\s+/).filter(Boolean).map(t => t.length > 3 && t.endsWith('s') ? t.slice(0, -1) : t);
function puntaje(c, toks) {
  let s = 0;
  for (const t of toks) {
    if (c._h.nombre.includes(t)) s += 3; else if (c._h.cat.includes(t)) s += 2; else if (c._h.resto.includes(t)) s += 1; else return 0;
  }
  return s;
}
function resultados() {
  const toks = tokens(S.q);
  let lista = visibles().map(c => ({c, p: toks.length ? puntaje(c, toks) : 1, d: (S.pos && c.lat != null) ? km(S.pos, c) : null})).filter(x => x.p > 0);
  if (S.cat) lista = lista.filter(x => x.c.categoria === S.cat);
  if (S.abiertos) lista = lista.filter(x => estado(x.c).abierto === true);
  const rank = x => { const a = estado(x.c).abierto; return a === true ? 0 : a === null ? 1 : 2; };
  lista.sort((a, b) => {
    if (toks.length && b.p !== a.p) return b.p - a.p;
    if (S.pos && a.d != null && b.d != null) return a.d - b.d;
    return rank(a) - rank(b) || (b.c.destacado ? 1 : 0) - (a.c.destacado ? 1 : 0) || a.c.nombre.localeCompare(b.c.nombre, 'es');
  });
  return lista;
}

/* ---------- voz ---------- */
function hablar(txt) {
  if (!('speechSynthesis' in window)) { toast('Tu dispositivo no puede leer en voz alta.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt), vs = speechSynthesis.getVoices();
  u.lang = 'es-AR'; u.rate = .95;
  const v = vs.find(x => /^es[-_]AR/i.test(x.lang)) || vs.find(x => /^es/i.test(x.lang)); if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function tilesHtml() {
  const cuenta = {}; visibles().forEach(c => cuenta[c.categoria] = (cuenta[c.categoria] || 0) + 1);
  const ids = [...new Set([...S.cats.map(c => c.id), ...Object.keys(cuenta)])].filter(id => cuenta[id] || S.editor);
  const total = ids.length, lim = (S.nVis > 0 && S.nVis < total) ? S.nVis : 0;

    if (S.cat && ids.includes(S.cat) && !mostrar.includes(S.cat)) mostrar.push(S.cat);
    restan = total - mostrar.length;
  }
  const tile = (id, i) => {
    const c = catPorId(id), sel = S.cat === id, fuera = S.editor && lim && i >= lim;
    const a = `<a class="tile" style="--c:${esc(c.color)};--i:${i}" href="${sel ? '#/' : '#/categoria/' + encodeURIComponent(id)}" ${sel ? 'aria-current="true"' : ''}>

    return `<div class="tw ${fuera ? 'fuera' : ''}" data-id="${esc(id)}" style="--i:${i}">${a}${fuera ? '<span class="tag-fuera" title="Solo se ve al tocar «Ver todas»">Oculta</span>' : ''}<button class="asa" type="button" data-asa="${esc(id)}" aria-label="Mover ${esc(c.nombre)}. Arrastralo o usá las flechas del teclado.">${GRIP}</button></div>`;
  };
  const ent = !S._anim; if (ent) setTimeout(() => S._anim = true, 1500);
  const ctl = S.editor ? `<div class="ctl-vis"><span class="t">Íconos visibles en el inicio <small>(lo ven todos)</small></span>
    <div class="fila-c"><div class="stepper"><button type="button" data-accion="vis-menos" aria-label="Mostrar menos íconos">−</button><b aria-live="polite">${lim || 'Todos'}</b><button type="button" data-accion="vis-mas" aria-label="Mostrar más íconos">+</button></div>

  const mas = restan ? `<div class="tw"><button class="tile mas" type="button" style="--c:#0B1B4D" data-accion="ver-mas"><span class="n">${restan}</span><span class="e">+${restan}</span><b>Ver todas</b></button></div>` : '';
  const menos = (!S.editor && lim && S.verTodas) ? '<button class="btn ver-menos" type="button" data-accion="ver-menos">Ver menos</button>' : '';

function parseMapa(txt) {
  const m = txt.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || txt.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || txt.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/) || txt.match(/^\s*(-?\d+\.\d+)\s*[, ]\s*(-?\d+\.\d+)\s*$/);
  return m ? {lat: +m[1], lng: +m[2]} : null;

function leerForm() {
  const v = id => ($('#' + id) || {}).value || '';
  const nombre = v('f_nombre').trim(); if (!nombre) throw new Error('Falta el nombre.');
  if (!v('f_cat')) throw new Error('Elegí una categoría.');

  if (lat || lng) {
    lat = Number(lat); lng = Number(lng);
    if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) throw new Error('La ubicación no es válida. Revisá latitud y longitud.');
  } else { lat = null; lng = null; }

    }
    case 'eliminar': {
      const c = porId(id); if (!c || !confirm(`¿Eliminar «${c.nombre}»? No se puede deshacer.\n\nSi solo querés ocultarlo, desmarcá «Visible al público».`)) return;
      try { await borrarComercio(id); cerrarModal(); if (ruta().t === 'comercio') location.hash = '#/'; else render(); toast('🗑️ Eliminado'); } catch (err) { mostrarError('f_err', err); } return;
    }
    case 'cat-guardar': {
      try {
        const nombre = $('#c_nombre').value.trim(), singular = $('#c_sing').value.trim();
        if (!nombre || !singular) throw new Error('Completá el nombre en plural y en singular.');
        const k = {id: id || slugify(nombre), nombre, singular, icono: $('#c_icono').value.trim() || 'i:tienda', color: $('#c_color').value, palabras: $('#c_pal').value.split(',').map(x => x.trim()).filter(Boolean), orden: id ? (S.cats.find(x => x.id === id) || {}).orden || 0 : S.cats.length + 1};
        if (!id && S.cats.some(x => x.id === k.id)) throw new Error('Ya existe una categoría con ese nombre.');
        el.disabled = true; await guardarCategoria(k, !id); modalCats(); render(); toast('✅ Guardado');
      } catch (err) { mostrarError('c_err', err); } finally { el.disabled = false; } return;
    }
    case 'cat-borrar': {
      const k = S.cats.find(x => x.id === id); if (!k || !confirm(`¿Eliminar la categoría «${k.nombre}»?`)) return;
      try { await borrarCategoria(id); modalCats(); render(); toast('🗑️ Eliminada'); } catch (err) { mostrarError('c_err', err); } return;
    }
    case 'exportar': {
      const blob = new Blob([JSON.stringify({rows: S.raw, cats: S.cats}, null, 2)], {type: 'application/json'});
      const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = 'directorio-copia.json'; l.click(); setTimeout(() => URL.revokeObjectURL(l.href), 2000); return toast('⬇️ Copia descargada');
    }
    case 'importar': return $('#fileImp').click();
    case 'ver-mas': S.verTodas = true; $('#zonaTiles').innerHTML = tilesHtml(); return;
    case 'ver-menos': S.verTodas = false; $('#zonaTiles').innerHTML = tilesHtml(); return;
    case 'vis-menos': case 'vis-mas': {
      const total = Number(($('#tilesNav') || {dataset: {}}).dataset.total) || 0, act = (S.nVis > 0 && S.nVis < total) ? S.nVis : total;
      const n = Math.max(1, a === 'vis-mas' ? act + 1 : act - 1); S.nVis = n >= total ? 0 : n;
      $('#zonaTiles').innerHTML = tilesHtml(); const b = $('[data-accion="' + a + '"]'); if (b) b.focus();
      clearTimeout(S._tv);
      S._tv = setTimeout(async () => { try { await guardarNVis(S.nVis); toast('✅ Guardado' + (remoto() ? ' para todos' : '')); } catch (err) { toast(mensajeError(err)); } }, 700);
      return;
    }
    case 'cat-sube': case 'cat-baja': {
      const ids = S.cats.map(k => k.id), i = ids.indexOf(id), j = a === 'cat-sube' ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= ids.length) return;
      [ids[i], ids[j]] = [ids[j], ids[i]];
      try { await guardarOrden(ids); render(); modalCats(); } catch (err) { toast(mensajeError(err)); } return;
    }
  }
});
/* ---------- ordenar categorías arrastrando (modo editor) ---------- */
let arr = null;
const idsEnOrden = () => [...document.querySelectorAll('#tilesNav .tw[data-id]')].map(x => x.dataset.id);
async function persistirOrden(foco) {
  try { await guardarOrden(idsEnOrden()); toast('✅ Orden guardado' + (remoto() ? ' para todos' : '')); }
  catch (err) { toast(mensajeError(err)); await recargar(); }
  const z = $('#zonaTiles'); if (!z) return;
  z.innerHTML = tilesHtml();
  if (foco) { const b = [...document.querySelectorAll('.asa')].find(x => x.dataset.asa === foco); if (b) b.focus(); }
}
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('.asa'); if (!h) return;
  e.preventDefault();
  const w = h.closest('.tw'); try { h.setPointerCapture(e.pointerId); } catch (err) {}
  arr = {w, id: e.pointerId, antes: idsEnOrden().join()}; w.classList.add('arrastrando');
});
document.addEventListener('pointermove', e => {
  if (!arr || e.pointerId !== arr.id) return;
  if (e.clientY < 90) window.scrollBy(0, -14); else if (e.clientY > innerHeight - 90) window.scrollBy(0, 14);
  const t = document.elementFromPoint(e.clientX, e.clientY), o = t && t.closest('#tilesNav .tw[data-id]');
  if (!o || o === arr.w) return;
  const hijos = [...arr.w.parentNode.children];
  // se mueve el vecino (no el que se arrastra) para no perder el control del dedo
  if (hijos.indexOf(o) > hijos.indexOf(arr.w)) arr.w.parentNode.insertBefore(o, arr.w); else arr.w.parentNode.insertBefore(o, arr.w.nextSibling);
});
const finArr = e => {
  if (!arr || e.pointerId !== arr.id) return;
  const a = arr; arr = null; a.w.classList.remove('arrastrando');
  if (a.antes !== idsEnOrden().join()) persistirOrden(a.w.dataset.id);
};
document.addEventListener('pointerup', finArr); document.addEventListener('pointercancel', finArr);
document.addEventListener('keydown', e => {
  const h = e.target.closest && e.target.closest('.asa'); if (!h) return;
  const dir = {ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1}[e.key]; if (!dir) return;
  e.preventDefault();
  const w = h.closest('.tw'), o = dir < 0 ? w.previousElementSibling : w.nextElementSibling; if (!o) return;
  if (dir < 0) w.parentNode.insertBefore(w, o); else w.parentNode.insertBefore(o, w);
  persistirOrden(w.dataset.id);
});

$('#fileImp').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!Array.isArray(j.rows) || !Array.isArray(j.cats)) throw new Error('formato');
    if (!confirm(`Se van a reemplazar los datos actuales por los del archivo (${j.rows.length} comercios). ¿Seguir?`)) return;
    S.raw = j.rows; S.cats = j.cats; persistirLocal(); render(); toast('⬆️ Datos cargados');
  } catch (err) { toast('Ese archivo no es una copia válida del directorio.'); }
});

async function iniciar() {
  try { const t = sessionStorage.getItem('dir_tok'), x = Number(sessionStorage.getItem('dir_exp')); if (t && x > Date.now()) { S.token = t; S.editor = true; } } catch (e) {}
  S.cargando = true; S.error = false; render();
  aplicar(await cargarDatos()); S.cargando = false;
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
iniciar();
</script>
